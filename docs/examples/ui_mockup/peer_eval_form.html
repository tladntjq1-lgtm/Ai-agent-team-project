<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
  UI ID: UI-PEER-02
Program ID: PG-05
관련 BR: BR-04, BR-05
관련 Scenario: SC-PEER-01, SC-PEER-02
사용 테이블: EvaluationTemplate, EvaluationQuestion, PeerEvaluation, PeerEvaluationAnswer
사용 컬럼 예: evaluator_id, target_student_id, question_id, score, comment, submitted_at
  -->
  <title>개인 평가 입력 | AX 평가 시스템 목업</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="common/css/common.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="ui_index_example.html">AX 평가 시스템</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="student_home.html">학생 홈</a></li>
        <li class="nav-item"><a class="nav-link" href="team_eval_list.html">팀 평가</a></li>
        <li class="nav-item"><a class="nav-link" href="peer_eval_list.html">개인 평가</a></li>
        <li class="nav-item"><a class="nav-link" href="evaluation_status.html">평가 현황</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h1 class="page-title h3 mb-1">개인 평가 입력</h1>
    <p class="text-muted mb-0">평가 대상: <strong data-query-param="student" data-fallback="학생 B">학생 B</strong></p>
  </div>
  <a href="peer_eval_list.html" class="btn btn-outline-secondary">목록으로</a>
</div>

<form onsubmit="return confirmMockSubmit('이 개인 평가를 제출하시겠습니까?', 'evaluation_status.html')">
  <div class="card mb-3">
    <div class="card-body">
      <h2 class="h6">1. 팀 과업에 적극적으로 참여했다.</h2>
      <select class="form-select mt-3" required>
        <option value="">점수를 선택하세요</option>
        <option>1 - 매우 그렇지 않다</option>
        <option>2 - 그렇지 않다</option>
        <option>3 - 보통이다</option>
        <option>4 - 그렇다</option>
        <option>5 - 매우 그렇다</option>
      </select>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <h2 class="h6">2. 맡은 역할을 책임감 있게 수행했다.</h2>
      <select class="form-select mt-3" required>
        <option value="">점수를 선택하세요</option>
        <option>1 - 매우 그렇지 않다</option>
        <option>2 - 그렇지 않다</option>
        <option>3 - 보통이다</option>
        <option>4 - 그렇다</option>
        <option>5 - 매우 그렇다</option>
      </select>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <label for="peerComment" class="form-label fw-semibold">동료에게 남길 의견</label>
      <textarea id="peerComment" class="form-control" rows="4"></textarea>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2">
    <a class="btn btn-outline-secondary" href="peer_eval_list.html">취소</a>
    <button class="btn btn-primary" type="submit">평가 제출</button>
  </div>
</form>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="common/js/common.js"></script>
</body>
</html>
