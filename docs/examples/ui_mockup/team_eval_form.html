<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
  UI ID: UI-TEAM-02
Program ID: PG-03
관련 BR: BR-01, BR-05
관련 Scenario: SC-TEAM-01, SC-TEAM-02, SC-TEAM-03
사용 테이블: EvaluationTemplate, EvaluationQuestion, TeamEvaluation, TeamEvaluationAnswer
사용 컬럼 예: template_id, question_id, evaluator_id, target_team_id, score, comment, submitted_at
  -->
  <title>팀 평가 입력 | AX 평가 시스템 목업</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="common/css/common.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="ui_index_example.html">AX 평가 시스템</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="student_home.html">학생 홈</a></li>
        <li class="nav-item"><a class="nav-link" href="team_eval_list.html">팀 평가</a></li>
        <li class="nav-item"><a class="nav-link" href="peer_eval_list.html">개인 평가</a></li>
        <li class="nav-item"><a class="nav-link" href="evaluation_status.html">평가 현황</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h1 class="page-title h3 mb-1">팀 평가 입력</h1>
    <p class="text-muted mb-0">평가 대상: <strong data-query-param="team" data-fallback="Team 2">Team 2</strong></p>
  </div>
  <a href="team_eval_list.html" class="btn btn-outline-secondary">목록으로</a>
</div>

<div class="alert alert-warning">
  목업 예시입니다. 실제 구현 시 서버에서 자신의 팀 여부와 중복 평가 여부를 다시 확인해야 합니다.
</div>

<form onsubmit="return confirmMockSubmit('이 팀 평가를 제출하시겠습니까?', 'evaluation_status.html')">
  <div class="card mb-3">
    <div class="card-body">
      <h2 class="h6">1. 발표 내용이 명확하고 이해하기 쉬웠다.</h2>
      <div class="d-flex flex-wrap gap-2 mt-3">
        <input class="btn-check" type="radio" name="q1" id="q1_1" required><label class="btn btn-outline-primary score-option" for="q1_1">1</label>
        <input class="btn-check" type="radio" name="q1" id="q1_2"><label class="btn btn-outline-primary score-option" for="q1_2">2</label>
        <input class="btn-check" type="radio" name="q1" id="q1_3"><label class="btn btn-outline-primary score-option" for="q1_3">3</label>
        <input class="btn-check" type="radio" name="q1" id="q1_4"><label class="btn btn-outline-primary score-option" for="q1_4">4</label>
        <input class="btn-check" type="radio" name="q1" id="q1_5"><label class="btn btn-outline-primary score-option" for="q1_5">5</label>
      </div>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <h2 class="h6">2. 요구사항을 충분히 이해하고 구현 방향을 설명했다.</h2>
      <div class="d-flex flex-wrap gap-2 mt-3">
        <input class="btn-check" type="radio" name="q2" id="q2_1" required><label class="btn btn-outline-primary score-option" for="q2_1">1</label>
        <input class="btn-check" type="radio" name="q2" id="q2_2"><label class="btn btn-outline-primary score-option" for="q2_2">2</label>
        <input class="btn-check" type="radio" name="q2" id="q2_3"><label class="btn btn-outline-primary score-option" for="q2_3">3</label>
        <input class="btn-check" type="radio" name="q2" id="q2_4"><label class="btn btn-outline-primary score-option" for="q2_4">4</label>
        <input class="btn-check" type="radio" name="q2" id="q2_5"><label class="btn btn-outline-primary score-option" for="q2_5">5</label>
      </div>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <label class="form-label fw-semibold" for="teamComment">의견</label>
      <textarea id="teamComment" class="form-control" rows="4" placeholder="선택 입력"></textarea>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2">
    <a class="btn btn-outline-secondary" href="team_eval_list.html">취소</a>
    <button class="btn btn-primary" type="submit">평가 제출</button>
  </div>
</form>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="common/js/common.js"></script>
</body>
</html>
