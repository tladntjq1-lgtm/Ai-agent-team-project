<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AX 평가 시스템 UI 목업 목록</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="common/css/common.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <span class="navbar-brand">AX 평가 시스템 - UI Mockup Index</span>
  </div>
</nav>

<main class="container py-4">
  <h1 class="h3 mb-3">UI 목업 목록</h1>
  <p class="text-muted">프로그램 목록과 실제 목업 파일을 연결하세요.</p>

  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>UI ID</th>
          <th>PG ID</th>
          <th>화면명</th>
          <th>파일명</th>
          <th>용도</th>
          <th>관련 BR</th>
          <th>열기</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>UI-XX-01</td>
          <td>PG-XX</td>
          <td>예시 화면</td>
          <td>sample.html</td>
          <td>학생이 실제 생성한 목업으로 교체</td>
          <td>BR-XX</td>
          <td><a class="btn btn-sm btn-primary disabled" href="#">준비중</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
