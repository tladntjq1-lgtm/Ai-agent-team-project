<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀원 및 통합담당자 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">통합 프로젝트 관리 시스템</a>
        </div>
    </nav>

    <div class="container">
        <h2>👥 팀 구성원 관리 (정원 6명)</h2>
        <p class="text-muted">팀원 역할을 지정하고 통합담당자를 설정합니다.</p>
        
        <div class="card my-3">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>No</th>
                            <th>이름</th>
                            <th>역할</th>
                            <th>통합담당 여부</th>
                            <th>상태</th>

                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>팀원 1</td>
                            <td>백엔드 / DB</td>
                            <td><span class="badge bg-success">통합담당자</span></td>
                            <td><span class="badge bg-primary">완료</span></td>
                        </tr>
                        <!-- 2~6번 팀원 행 추가 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
