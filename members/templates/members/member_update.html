{% extends 'base.html' %}

{% block content %}

<div class="page-header mb-3">

    <div class="row align-items-center">

        <div class="col">

            <div class="page-pretitle">
                회원 관리
            </div>

            <h2 class="page-title">
                회원 수정
            </h2>

        </div>

    </div>

</div>

<div class="card">
    <div class="card-body">

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                수정 저장
            </button>

            <a href="{% url 'member_list' %}" class="btn btn-secondary">
                취소
            </a>
        </form>

    </div>
</div>

{% endblock %}
