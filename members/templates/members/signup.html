<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
  UI ID: UI-02
  화면명: 학생 회원가입
  -->

  <title>회원가입</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body class="bg-light">

  <main class="container min-vh-100 d-flex justify-content-center align-items-center py-5">

    <div class="row justify-content-center w-100">

      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

        <div class="card border-0 shadow-sm rounded-4">

          <div class="card-body p-4 p-md-5">

            <!-- 제목 -->
            <div class="text-center mb-4">

              <h1 class="fw-bold mb-2">
                회원가입
              </h1>

              <p class="text-muted mb-0">
                참교육 학생 계정을 생성합니다.
              </p>

            </div>


            <!-- 오류 메시지 -->
            {% if error %}

            <div
              class="alert alert-danger"
              role="alert"
            >
              {{ error }}
            </div>

            {% endif %}


            <!-- 회원가입 폼 -->
            <form method="POST">

              {% csrf_token %}


              <!-- 아이디 -->
              <div class="mb-3">

                <label
                  for="loginId"
                  class="form-label fw-semibold"
                >
                  아이디
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="loginId"
                  name="login_id"
                  placeholder="사용할 아이디를 입력하세요"
                  autocomplete="username"
                  required
                >

              </div>


              <!-- 비밀번호 -->
              <div class="mb-3">

                <label
                  for="password"
                  class="form-label fw-semibold"
                >
                  비밀번호
                </label>

                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="비밀번호를 입력하세요"
                  autocomplete="new-password"
                  required
                >

              </div>


              <!-- 비밀번호 확인 -->
              <div class="mb-3">

                <label
                  for="passwordConfirm"
                  class="form-label fw-semibold"
                >
                  비밀번호 확인
                </label>

                <input
                  type="password"
                  class="form-control"
                  id="passwordConfirm"
                  name="password_confirm"
                  placeholder="비밀번호를 다시 입력하세요"
                  autocomplete="new-password"
                  required
                >

              </div>


              <hr class="my-4">


              <!-- 이름 -->
              <div class="mb-3">

                <label
                  for="name"
                  class="form-label fw-semibold"
                >
                  이름
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  placeholder="이름을 입력하세요"
                  required
                >

              </div>


              <!-- 이메일 -->
              <div class="mb-3">

                <label
                  for="email"
                  class="form-label fw-semibold"
                >
                  이메일
                </label>

                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  placeholder="example@email.com"
                >

              </div>


              <!-- 전화번호 -->
              <div class="mb-3">

                <label
                  for="phone"
                  class="form-label fw-semibold"
                >
                  전화번호
                </label>

                <input
                  type="tel"
                  class="form-control"
                  id="phone"
                  name="phone"
                  placeholder="010-0000-0000"
                >

              </div>


              <!-- Slack ID -->
              <div class="mb-4">

                <label
                  for="slackId"
                  class="form-label fw-semibold"
                >
                  Slack ID
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="slackId"
                  name="slack_id"
                  placeholder="Slack ID를 입력하세요"
                >

              </div>


              <!-- 회원가입 버튼 -->
              <div class="d-grid gap-2">

                <button
                  type="submit"
                  class="btn btn-primary btn-lg"
                >
                  회원가입
                </button>

                <a
                  href="{% url 'login' %}"
                  class="btn btn-outline-secondary"
                >
                  로그인으로 돌아가기
                </a>

              </div>

            </form>

          </div>

        </div>

      </div>

    </div>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

</body>
</html>
